name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.lock
      - run: .venv/bin/python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
      - name: Ruff
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Pyright
        run: .venv/bin/pyright
      - name: Skill and YAML validation
        run: |
          .venv/bin/python scripts/validate_skill.py .
          .venv/bin/yamllint agents .github .pre-commit-config.yaml
      - name: Markdown lint
        run: |
          npm ci
          npm run lint:md

  tests:
    name: Tests on Python ${{ matrix.python-version }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.lock
      - run: .venv/bin/python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
      - name: Pytest with branch coverage
        run: >-
          .venv/bin/pytest
          --cov=invoice_generator
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90

  bootstrap:
    name: Bootstrap on ${{ matrix.os }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/invoice.py bootstrap
      - run: python scripts/invoice.py probe --workspace .

  package:
    name: Build and install wheel
    needs: [tests, bootstrap]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build==1.3.0
      - run: python -m build
      - run: python -m venv package-smoke
      - run: package-smoke/bin/python -m pip install dist/*.whl
      - name: Verify packaged resources
        run: >-
          package-smoke/bin/python -c
          "from invoice_generator.resources import font_directory, template_path;
          assert (font_directory() / 'NotoSans-Variable.ttf').is_file();
          assert template_path('owner.example.md').is_file()"

  codeql:
    name: CodeQL analysis
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
