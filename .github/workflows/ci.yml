name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.lock
      - run: .venv/bin/python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/pyright
      - run: .venv/bin/pytest --cov=invoice_generator --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - run: .venv/bin/python scripts/validate_skill.py .
      - run: .venv/bin/yamllint agents .github .pre-commit-config.yaml

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint:md

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build==1.3.0
      - run: python -m build
      - run: python -m venv package-smoke
      - run: package-smoke/bin/python -m pip install dist/*.whl
      - run: package-smoke/bin/python -c "from invoice_generator.resources import font_directory, template_path; assert (font_directory() / 'NotoSans-Variable.ttf').is_file(); assert template_path('owner.example.md').is_file()"

  bootstrap-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/invoice.py bootstrap
      - run: python scripts/invoice.py probe --workspace .
