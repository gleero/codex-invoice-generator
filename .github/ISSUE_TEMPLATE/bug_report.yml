name: Bug report
description: Report a reproducible Invoice Generator problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Remove bank details, client records, and invoices before submitting."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the request, expected behavior, and actual behavior without private data.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and Python version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
