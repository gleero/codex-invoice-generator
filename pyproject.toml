[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-invoice-generator"
version = "1.0.1"
description = "Portable Codex skill and CLI for deterministic client invoices"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Vladimir Perekladov", email = "gleero@gmail.com"}]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "filelock==3.19.1",
  "Pillow==11.3.0",
  "PyMuPDF==1.26.4",
  "PyYAML==6.0.2",
  "reportlab==4.4.3",
]

[project.urls]
Homepage = "https://github.com/gleero/codex-invoice-generator"
Repository = "https://github.com/gleero/codex-invoice-generator.git"
Issues = "https://github.com/gleero/codex-invoice-generator/issues"

[project.optional-dependencies]
dev = [
  "build==1.6.0",
  "bump-my-version==1.5.1",
  "pre-commit==4.3.0",
  "pyright==1.1.405",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.10",
  "yamllint==1.37.1",
]

[project.scripts]
invoice = "invoice_generator.cli:main"

[tool.setuptools.packages.find]
include = ["invoice_generator*"]

[tool.setuptools.data-files]
"share/invoice-generator/assets/fonts" = [
  "assets/fonts/LiberationSans-Regular.ttf",
  "assets/fonts/LiberationSerif-Bold.ttf",
  "assets/fonts/Merriweather-Bold.ttf",
  "assets/fonts/NotoSans-Variable.ttf",
  "assets/fonts/NOTICE.md",
  "assets/fonts/NotoSans-OFL.txt",
  "assets/fonts/OFL-1.1.txt",
]
"share/invoice-generator/templates" = [
  "templates/client.example.md",
  "templates/invoices.example.md",
  "templates/owner.example.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["invoice_generator"]
omit = ["invoice_generator/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["invoice_generator", "scripts", "tests"]
exclude = [".venv", "tmp"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false

[tool.bumpversion]
current_version = "1.0.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = false
tag = false
allow_dirty = false

[[tool.bumpversion.files]]
filename = "invoice_generator/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "package-lock.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'
